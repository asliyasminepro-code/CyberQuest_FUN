<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)" stroke="#263352" stroke-width="3"/>
  <!-- Shield Emblem -->
  <path d="M 96 32 L 144 54 C 144 104 122 136 96 154 C 70 136 48 104 48 54 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <!-- Inner Circuit Keyhole -->
  <path d="M 96 46 L 132 64 C 132 102 114 126 96 140 C 78 126 60 102 60 64 Z" fill="#0b101d" opacity="0.85"/>
  <circle cx="96" cy="85" r="14" fill="#00f0ff"/>
  <polygon points="90,85 102,85 106,112 86,112" fill="#00f0ff"/>
</svg>

