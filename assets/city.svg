<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" class="cq-city-svg" role="region" aria-label="CyberCity Interactive Tactical Map">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#17233f" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients for Buildings -->
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1832" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#180e2a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09241a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#281a05" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#280918" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- City Backdrop & Grid -->
  <rect width="1200" height="675" fill="#0b101d"/>
  <rect width="1200" height="675" fill="url(#cyberGrid)"/>

  <!-- Glowing Cyber Conduits Interconnecting Districts -->
  <g class="cq-city-conduits" fill="none" stroke-width="2">
    <!-- Hub to North-West -->
    <path d="M 600 340 L 220 180" stroke="#00f0ff" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to North-Center -->
    <path d="M 600 340 L 460 140" stroke="#a855f7" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to North-East -->
    <path d="M 600 340 L 740 130" stroke="#10b981" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to Far East -->
    <path d="M 600 340 L 980 180" stroke="#f59e0b" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to South-West -->
    <path d="M 600 340 L 280 480" stroke="#00f0ff" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to South-Center -->
    <path d="M 600 340 L 580 440" stroke="#ec4899" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to South-East -->
    <path d="M 600 340 L 880 460" stroke="#8b5cf6" stroke-opacity="0.4" class="cq-city-cable"/>
    <!-- Hub to Bonus South -->
    <path d="M 600 340 L 600 580" stroke="#f97316" stroke-opacity="0.5" class="cq-city-cable"/>
  </g>

  <!-- Central CyberCity Nexus Core -->
  <g id="city-nexus" transform="translate(600, 340)">
    <circle r="42" fill="#121b2f" stroke="#00f0ff" stroke-width="2" filter="url(#glowCyan)"/>
    <circle r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle r="12" fill="#00f0ff" opacity="0.8"/>
    <text y="5" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">CYBER</text>
    <text y="18" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="sans-serif">CORE</text>
  </g>

  <!-- DISTRICT 1: Mailbox Quarter (Phishing Detective) -->
  <g id="district-phishing" class="cq-map-district" transform="translate(140, 110)" tabindex="0" role="button" aria-label="Mailbox Quarter — Phishing Detective">
    <rect width="160" height="110" rx="12" fill="url(#gradCyan)" stroke="#00f0ff" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">✉️</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Mailbox Quarter</text>
    <text x="80" y="88" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="sans-serif">Phishing Detective</text>
    <circle cx="80" cy="110" r="6" fill="#00f0ff" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 2: Vault District (Password Lab) -->
  <g id="district-password" class="cq-map-district" transform="translate(380, 80)" tabindex="0" role="button" aria-label="Vault District — Password Lab">
    <rect width="160" height="110" rx="12" fill="url(#gradPurple)" stroke="#a855f7" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">🔐</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Vault District</text>
    <text x="80" y="88" text-anchor="middle" fill="#c084fc" font-size="11" font-family="sans-serif">Password Lab</text>
    <circle cx="80" cy="110" r="6" fill="#a855f7" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 3: Firewall Fortress (Ethical Hacker Mission) -->
  <g id="district-ethical" class="cq-map-district" transform="translate(660, 75)" tabindex="0" role="button" aria-label="Firewall Fortress — Ethical Hacker Mission">
    <rect width="160" height="110" rx="12" fill="url(#gradGreen)" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">🏰</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Firewall Fortress</text>
    <text x="80" y="88" text-anchor="middle" fill="#34d399" font-size="11" font-family="sans-serif">Ethical Hacker</text>
    <circle cx="80" cy="110" r="6" fill="#10b981" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 4: Office Tower (Spot the Flaws) -->
  <g id="district-flaws" class="cq-map-district" transform="translate(900, 120)" tabindex="0" role="button" aria-label="Office Tower — Spot the Flaws">
    <rect width="160" height="110" rx="12" fill="url(#gradAmber)" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">🏢</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Office Tower</text>
    <text x="80" y="88" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="sans-serif">Spot the Flaws</text>
    <circle cx="80" cy="110" r="6" fill="#f59e0b" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 5: Academy (Cybersecurity Quiz) -->
  <g id="district-quiz" class="cq-map-district" transform="translate(200, 420)" tabindex="0" role="button" aria-label="Academy — Cybersecurity Quiz">
    <rect width="160" height="110" rx="12" fill="url(#gradCyan)" stroke="#00f0ff" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">🏛️</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Academy</text>
    <text x="80" y="88" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="sans-serif">Cyber Quiz</text>
    <circle cx="80" cy="0" r="6" fill="#00f0ff" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 6: Myth Plaza (True or False) -->
  <g id="district-myths" class="cq-map-district" transform="translate(500, 390)" tabindex="0" role="button" aria-label="Myth Plaza — True or False">
    <rect width="160" height="110" rx="12" fill="url(#gradPink)" stroke="#ec4899" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">🔮</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Myth Plaza</text>
    <text x="80" y="88" text-anchor="middle" fill="#f472b6" font-size="11" font-family="sans-serif">True or False</text>
    <circle cx="80" cy="0" r="6" fill="#ec4899" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 7: AI Lab (AI and Cybersecurity) -->
  <g id="district-ai" class="cq-map-district" transform="translate(800, 410)" tabindex="0" role="button" aria-label="AI Lab — AI and Cybersecurity">
    <rect width="160" height="110" rx="12" fill="url(#gradPurple)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-size="28">🤖</text>
    <text x="80" y="70" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">AI Lab</text>
    <text x="80" y="88" text-anchor="middle" fill="#a78bfa" font-size="11" font-family="sans-serif">AI &amp; Cyber</text>
    <circle cx="80" cy="0" r="6" fill="#8b5cf6" class="cq-map-beacon"/>
  </g>

  <!-- DISTRICT 8: Bonus Alley (Quick Bonus Missions) -->
  <g id="district-bonus" class="cq-map-district" transform="translate(500, 530)" tabindex="0" role="button" aria-label="Bonus Alley — Quick Bonus Missions">
    <rect width="200" height="95" rx="14" fill="#1e182e" stroke="#f97316" stroke-width="2.5"/>
    <text x="100" y="38" text-anchor="middle" font-size="26">⚡</text>
    <text x="100" y="62" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Bonus Alley</text>
    <text x="100" y="80" text-anchor="middle" fill="#fb923c" font-size="11" font-family="sans-serif">6 Quick Challenges</text>
    <circle cx="100" cy="0" r="6" fill="#f97316" class="cq-map-beacon"/>
  </g>
</svg>

